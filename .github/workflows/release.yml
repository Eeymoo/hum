name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  version-sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Sync API version
        working-directory: ./apps/api
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
      - name: Sync CLI version
        working-directory: ./packages/cli
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

  publish-npm:
    needs: version-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --workspace=packages/cli
      - working-directory: ./packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: version-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hum-api:v${{ needs.version-sync.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hum-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
