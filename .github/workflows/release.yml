name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  version-sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Check version
        id: check_version
        run: |
          API_VERSION=$(node -p "require('./apps/api/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Current API version: $API_VERSION"
          echo "Current CLI version: $CLI_VERSION"
          echo "Target version: ${{ steps.version.outputs.VERSION }}"
          if [ "$API_VERSION" != "${{ steps.version.outputs.VERSION }}" ] || [ "$CLI_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
      - name: Sync API version
        if: steps.check_version.outputs.needs_update == 'true'
        working-directory: ./apps/api
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
      - name: Sync CLI version
        if: steps.check_version.outputs.needs_update == 'true'
        working-directory: ./packages/cli
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

  publish-npm:
    needs: version-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p \"require('./packages/cli/package.json').version\")" >> $GITHUB_OUTPUT
      - run: npm ci
      - run: npm run build --workspace=packages/cli
      - working-directory: ./packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: version-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p \"require('./apps/api/package.json').version\")" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hum-api:v${{ needs.version-sync.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hum-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
