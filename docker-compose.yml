version: "3.8"

services:
  hum-api:
    image: ghcr.io/eeymoo/hum-api:latest
    container_name: hum-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=${DB_TYPE}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      - hum_api_data:/app/prisma
      - hum_api_uploads:/app/uploads
    networks:
      ai_net:
        ipv4_address: 10.10.4.9
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hum-postgres:
    image: postgres:16-alpine
    container_name: hum-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-hum}
    volumes:
      - hum_postgres_data:/var/lib/postgresql/data
    networks:
      ai_net:
        ipv4_address: 10.10.4.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hum} -d ${POSTGRES_DB:-hum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  hum_api_data:
  hum_api_uploads:
  hum_postgres_data:

networks:
  ai_net:
    external: true
